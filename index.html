<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDAF | Painel de Controle</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card-bg);
            padding: 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            padding: 2rem;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .stat-card h3 { margin: 0; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; }
        .stat-card p { margin: 0.5rem 0 0; font-size: 1.8rem; font-weight: bold; color: var(--accent); }

        .controls {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary { background: var(--accent); color: var(--bg); }
        .btn-outline { background: transparent; border: 1px solid #334155; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #1e293b; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; }
        
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .badge-live { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h2 style="margin:0; color: var(--accent)">ADDAF <span style="color: white; font-weight: 300;">Monitor</span></h2>
    </div>
    <div id="clock" style="font-family: monospace; font-size: 1.2rem;">00:00:00</div>
</header>

<div class="container">
    <div class="status-bar">
        <div class="stat-card">
            <h3>Músicas Capturadas</h3>
            <p id="count-total">0</p>
        </div>
        <div class="stat-card">
            <h3>Última Varredura</h3>
            <p id="last-scan" style="font-size: 1.2rem; margin-top: 15px;">Nenhuma</p>
        </div>
        <div class="stat-card">
            <h3>Próximo Relatório</h3>
            <p id="timer" style="font-size: 1.2rem; margin-top: 15px;">02:00:00</p>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="triggerManualScan()">Forçar Varredura Agora</button>
        <button class="btn btn-outline" onclick="clearLogs()">Limpar Banco Local</button>
        <span style="color: #64748b; font-size: 0.9rem;">(Modo de Teste: LocalStorage Ativo)</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Data/Hora</th>
                <th>Origem</th>
                <th>Título da Obra</th>
                <th>Artista / Intérprete</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="log-table">
            <!-- JS vai preencher -->
        </tbody>
    </table>
    <div id="empty-msg" class="empty-state">Nenhum dado capturado ainda.</div>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('addaf_db')) || [];

    function updateUI() {
        const tableBody = document.getElementById('log-table');
        const emptyMsg = document.getElementById('empty-msg');
        const countTotal = document.getElementById('count-total');
        
        tableBody.innerHTML = '';
        
        if (logs.length === 0) {
            emptyMsg.style.display = 'block';
        } else {
            emptyMsg.style.display = 'none';
            // Mostra os 10 últimos para não travar a tela no teste
            logs.slice().reverse().forEach(item => {
                const row = `<tr>
                    <td>${item.timestamp}</td>
                    <td><span style="color: var(--accent)">${item.source}</span></td>
                    <td><strong>${item.title}</strong></td>
                    <td>${item.artist}</td>
                    <td><span class="badge badge-live">IDENTIFICADO</span></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }
        
        countTotal.innerText = logs.length;
        if(logs.length > 0) {
            document.getElementById('last-scan').innerText = logs[logs.length - 1].timestamp.split(' ')[1];
        }
    }

    function triggerManualScan() {
        const sources = ["Rede Globo (Ao Vivo)", "Jovem Pan FM", "Spotify Brasil Viral", "YouTube Music Live", "Antena 1", "Disney+"];
        const library = [
            {t: "Flowers", a: "Miley Cyrus"},
            {t: "Houdini", a: "Eminem"},
            {t: "Texas Hold 'Em", a: "Beyoncé"},
            {t: "Espresso", a: "Sabrina Carpenter"},
            {t: "Die With A Smile", a: "Lady Gaga & Bruno Mars"},
            {t: "Puntería", a: "Shakira"}
        ];

        const randomSource = sources[Math.floor(Math.random() * sources.length)];
        const randomTrack = library[Math.floor(Math.random() * library.length)];
        
        const newEntry = {
            id: Date.now(),
            timestamp: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
            source: randomSource,
            title: randomTrack.t,
            artist: randomTrack.a
        };

        logs.push(newEntry);
        localStorage.setItem('addaf_db', JSON.stringify(logs));
        
        Swal.fire({
            title: 'Captura Realizada!',
            text: `Identificado: ${randomTrack.t} em ${randomSource}`,
            icon: 'success',
            toast: true,
            position: 'top-end',
            timer: 3000,
            showConfirmButton: false
        });

        updateUI();
    }

    function clearLogs() {
        if(confirm("Deseja resetar o banco de dados local?")) {
            localStorage.removeItem('addaf_db');
            logs = [];
            updateUI();
        }
    }

    // Relógio e Contador Progressivo
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // Inicialização
    updateUI();
</script>

</body>
</html>
